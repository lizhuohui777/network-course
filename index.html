  <article class="topic" id="d1-client-server" data-topic="客户端、服务器与协议">
    <h3>网页不是凭空出现在屏幕上的。</h3>
    <p>想象你打开一个课程网站。<strong>浏览器先提出请求，对方的服务程序处理请求，再返回内容。</strong>浏览器拿到描述页面的内容后，才把它显示出来。</p>
    <figure class="figure"><div class="flow" role="img" aria-label="浏览器作为客户端发送网页请求，服务器的服务程序处理并返回网页内容"><div class="endpoint"><strong>你的浏览器</strong><span>运行在你的设备上<br>客户端程序</span></div><div class="flow-middle">想要课程首页<span class="flow-arrow">→</span><span class="flow-arrow">←</span>返回页面内容</div><div class="endpoint"><strong>网站服务程序</strong><span>运行在远方的设备上<br>服务器程序</span></div></div><figcaption>图1 · 请求与响应。中间可能经过多台网络设备。</figcaption></figure>
    <div class="three-col"><div class="mini-card"><strong>客户端</strong><p>在这次交互中发起请求的一方。浏览器是常见例子；手机App也可以是客户端。</p></div><div class="mini-card"><strong>服务器</strong><p>提供服务、接收并处理请求的一方。这个词有时指程序，有时指运行程序的计算机，要看上下文。</p></div><div class="mini-card"><strong>协议</strong><p>双方交流遵守的规则：消息怎么写、字段是什么意思、收到后怎样回应。</p></div></div>
    <h4 style="margin-top:24px">例子：你说“给我首页”，对方得知道怎么读。</h4>
    <p>如果你随意发出一串字，对方未必知道你要什么。协议就像约好的表格：哪一格写目标，哪一格写动作。<strong>HTTP</strong> 就是一套用于Web通信的应用层规则；它不是网页内容本身，也不是浏览器这个软件。</p>
    <p><strong>把“设备”和“程序”分开想。</strong>一台计算机可以同时运行多个程序，也可能同时扮演不同角色。例如，网站的服务程序接待你的请求时是服务器；它向另一项服务请求数据时，又扮演客户端。</p>
    <div class="callout warm"><strong>类比能帮助理解，但角色没有固定身份。</strong><p>把客户端想成顾客、服务器想成服务台，只对应“请求与提供服务”的关系。不能据此推断服务器永远被动、永远不能主动通信。</p></div>
    <details class="mini-check"><summary>练习：浏览器、计算机、HTTP，分别属于什么？</summary><p>浏览器是程序；计算机是运行程序的设备；HTTP是通信规则。程序使用规则交换数据，设备承载程序并连接网络。</p></details>
    <div class="topic-actions"><div class="rating-group" data-topic-rating="d1-client-server"></div><button class="text-button" data-feedback="d1-client-server">这里还没懂 →</button></div>
  </article>

  <article class="topic" id="d1-layers" data-topic="分层模型与封装">
    <h3>一次通信，需要好几种不同的能力。</h3>
    <p>“把网页发过去”看似只有一件事，实际要解决：内容怎么表达、交给哪个程序、跨网络怎么走、相邻设备怎么传，以及最后怎样变成信号。<strong>把不同问题拆成不同层，就可以分别设计和改进。</strong></p>
    <p>例如，从Wi-Fi换成网线，并不意味着网站要重新发明一套HTTP规则。上层使用下层提供的能力，而不是自己处理所有细节。这正是分层带来的价值。</p>
    <figure class="figure"><span class="eyebrow">点一个职责，看它解决的问题</span><div class="layer-controls" role="group" aria-label="选择要了解的网络层"><button class="layer-button" data-layer="application" aria-pressed="true">应用</button><button class="layer-button" data-layer="transport" aria-pressed="false">传输</button><button class="layer-button" data-layer="network" aria-pressed="false">网络</button><button class="layer-button" data-layer="link" aria-pressed="false">链路</button><button class="layer-button" data-layer="physical" aria-pressed="false">物理</button></div>
      <div class="stack" role="img" aria-label="五层教学模型从上到下为应用、传输、网络、数据链路和物理；发送时向下使用各层能力"><div class="stack-row active" data-stack="application"><strong>应用层</strong><span>交流什么，内容怎样表达<small>例：HTTP、DNS</small></span></div><div class="stack-row" data-stack="transport"><strong>传输层</strong><span>应用端点之间怎样传送<small>例：TCP、UDP；涉及端口</small></span></div><div class="stack-row" data-stack="network"><strong>网络层</strong><span>跨网络寻址与转发<small>例：IP；涉及IP地址</small></span></div><div class="stack-row" data-stack="link"><strong>链路层</strong><span>在当前链路上怎样交付<small>例：以太网、Wi-Fi相关机制</small></span></div><div class="stack-row" data-stack="physical"><strong>物理层</strong><span>比特怎样用信号承载<small>例：电信号、光信号、无线电信号</small></span></div></div>
      <div id="layer-explanation" class="stack-desc" aria-live="polite"><strong>应用层：先约定“说的是什么”。</strong><p>浏览器表达“我要这份资源”，服务器表达“这是结果”。它们需要能理解彼此的消息，而不是只收到一串没有含义的比特。</p></div><figcaption>图2 · 五层教学模型</figcaption>
    </figure>
    <h4>为什么有的材料写七层，有的写四层？</h4>
    <p>它们是观察同一类通信问题的不同框架，<strong>不是“数字越多越先进”，也不是每台设备内部都有七个实体抽屉。</strong>RFC 1122使用四层的Internet体系结构；五层是常见教学划分；OSI则提供七层参考模型。</p>
    <div class="table-wrap"><table class="model-table"><caption class="micro" style="text-align:left;padding-bottom:8px">模型职责对照（并非严格一一对应）</caption><thead><tr><th>五层教学框架</th><th>OSI七层中的对应职责</th><th>Internet四层中的大致位置</th></tr></thead><tbody><tr><td>应用</td><td>应用、表示、会话</td><td>应用</td></tr><tr><td>传输</td><td>传输</td><td>传输</td></tr><tr><td>网络</td><td>网络</td><td>互联网</td></tr><tr><td>链路＋物理</td><td>数据链路、物理</td><td>链路</td></tr></tbody></table></div>
    <details class="mini-check"><summary>表示层和会话层做什么？</summary><p><strong>表示层</strong>关注数据的表示和转换，例如编码、压缩、加密等职责；<strong>会话层</strong>关注通信会话的建立、管理和终止。这是参考模型的职责划分，实际Internet协议不一定单独实现这两层。</p><p>注意：网站登录中的“Session”不是直接等同于OSI会话层；后者也不负责用端口把数据分给程序。端口属于传输层。</p></details>
    <h4 style="margin-top:25px">数据经过各层时，会加上本层需要的信息。</h4>
    <p>假设浏览器使用<strong>明文HTTP/1.1经TCP</strong>发送一小段请求。应用先形成请求数据；TCP加入传输需要的首部；IP再加入寻址需要的首部；链路层形成在当前链路传送的帧。这叫<strong>封装</strong>。首部就是放在前面的一组控制信息，不是给人读的标题。</p>
    <figure class="figure"><div class="demo-buttons"><button id="encap-next" class="primary">给数据加一层包装</button><button id="encap-reset">重新演示</button><span id="encap-step" class="chip">0 / 3</span></div><div class="envelope" id="encap-visual" role="img" aria-label="只有应用请求数据，尚未添加TCP、IP和链路控制信息"><div class="packet" data-level="0">应用请求数据</div></div><p id="encap-description" class="demo-caption" aria-live="polite">起点：应用已经组织好要交流的内容。接下来每层只添加自己需要的信息。</p><figcaption>图3 · 概念演示，省略分段、链路尾部等细节。应用的一条消息不一定正好对应一个TCP报文段。</figcaption></figure>
    <p>接收方向则逐层解释并处理控制信息，最终让应用拿到需要的数据，可以理解为<strong>解封装</strong>。把它想成“信纸外套信封”有助于看出嵌套关系，但网络数据可能被分段或重新组织，并不是一个永不拆开的包裹。</p>
    <div class="callout"><strong>把四个常用叫法先对上位置。</strong><p>在这个TCP示例里：传输层常说“TCP报文段”，网络层说“IP数据报/包”，链路层说“帧”，物理传输涉及“比特”。“比特”是0或1这样的二进制信息单位。</p></div>
    <details class="mini-check"><summary>HTTP一定用TCP吗？</summary><p>不是。HTTP/1.1通常使用TCP；HTTP/3使用QUIC，QUIC运行在UDP之上。</p></details>
    <details class="mini-check"><summary>练习：Wi-Fi和HTTP为何能同时服务一次访问？</summary><p>它们解决不同层次的问题。应用层组织请求，借助下层运输、寻址和链路能力传送。换掉一种接入方式，不必同时换掉应用消息的规则。</p></details>
    <div class="topic-actions"><div class="rating-group" data-topic-rating="d1-layers"></div><button class="text-button" data-feedback="d1-layers">这里还没懂 →</button></div>
  </article>

  <article class="topic" id="d1-addresses" data-topic="IP地址与端口的分工">
    <h3>找到网络地址，还不等于选中了服务。</h3>
    <p>同一台服务器可以同时提供不同服务。只知道一个IP地址，还不足以表达“我要和这里的哪项TCP或UDP服务通信”。<strong>IP用于网络层寻址；端口用于传输层，帮助定位通信端点。</strong></p>
    <p>初学时可以暂把IP看成“到哪处地址”，端口看成“在这个地址上找哪个服务入口”。但真实网络里，一台设备可以有多个IP地址，多个程序的安排也有例外，所以“IP=一台电脑、端口=一个固定程序”只能是简化印象。</p>
    <figure class="figure"><span class="eyebrow">同一个IP，不同的服务入口</span><div class="address-map" role="img" aria-label="客户端192.0.2.10连接服务器198.51.100.20，服务器提供TCP443和TCP8443两个示意服务端口"><div class="address-client"><strong>浏览器</strong><br><code>192.0.2.10</code><br><small>客户端IP</small></div><span class="flow-arrow">→</span><div class="address-server"><strong>同一个服务器IP</strong><br><code>198.51.100.20</code><div class="service active" data-service="443"><span>课程首页</span><code>TCP :443</code></div><div class="service" data-service="8443"><span>另一项Web服务</span><code>TCP :8443</code></div></div></div><div class="demo-buttons" style="margin-top:18px"><button data-port="443" aria-pressed="true">访问课程首页</button><button data-port="8443" aria-pressed="false">访问另一服务</button></div><p id="port-explanation" class="demo-caption" aria-live="polite">目标为TCP的 198.51.100.20:443。IP相同，端口用于区分这里的服务入口。</p><figcaption>图4 · 地址与服务均为教学示意。443是HTTPS常用端口；8443在本例中人为分配给另一服务，不是必须这样使用。</figcaption></figure>
    <h4>把“楼房地址与房间号”类比用到正确的位置。</h4>
    <p>IP像楼房地址、端口像房间号，这能帮助区分两级定位。但房间号本身没有全球唯一性：另一栋楼也能有“443号房间”。同样，<strong>不同IP可以使用相同端口号，TCP和UDP的端口空间也分别管理。</strong></p>
    <p>一个服务还可能同时接待许多客户端。别把端口想成“只容一个人占用的座位”。</p>
    <div class="callout"><strong>端口号的范围：0–65535</strong><p>TCP/UDP端口号字段是16位，有2<sup>16</sup>＝65536种取值，因此编号从0到65535。端口0被保留；不能写成“1到65536”。</p></div>
    <details class="mini-check"><summary>端口范围怎样划分？</summary><p>0–1023是系统端口范围，1024–49151是用户端口范围，49152–65535是动态/私有范围。这里说的是IANA的分配分类，不是说每台操作系统都使用相同的临时端口范围，也不是说普通用户在所有系统上都能直接绑定任意端口。</p></details>
    <h4 style="margin-top:24px">小练习：网站换了服务端口，IP没变。</h4>
    <p>原来访问 <code>198.51.100.20:443</code>，现在服务只监听 <code>198.51.100.20:8443</code>。如果仍向443发起访问，“IP相同”能保证找到原来的服务吗？</p>
    <details class="mini-check"><summary>查看解释</summary><p>不能。IP确定的是网络层目标；指定的传输协议与端口也必须匹配服务入口。就像到了正确楼房，却找错了房间。能否连通还涉及防火墙等条件，匹配地址和端口只是必要检查的一部分。</p></details>
    <div class="topic-actions"><div class="rating-group" data-topic-rating="d1-addresses"></div><button class="text-button" data-feedback="d1-addresses">这里还没懂 →</button></div>
  </article>
  <div class="callout warm"><strong>本课小结</strong><p>客户端和服务器的程序按协议交流；分层让消息表达、传输、寻址和链路各司其职；封装携带各层所需信息；IP与端口帮助把数据送向相应的通信端点。</p></div>
</section>

<section class="lesson-section" id="d1-quiz">
  <div class="section-heading"><h2><span class="section-number">03</span>理解自测</h2></div>
  <p>先独立回答，再展开参考答案。</p>
  <article class="question" data-quiz="d1-q1"><h3>1 / 找到服务器IP以后，为什么还需要端口？</h3><p>假设同一服务器提供两项Web服务。请用一句原因和一个例子回答。</p><div class="quiz-input"></div><details><summary>查看参考答案</summary><div class="answer"><p><strong>核心理由：</strong>IP用于网络层寻址；同一IP上可以有不同服务，需要结合传输协议与端口区分通信端点。例如同一个IP的TCP443提供课程首页，TCP8443提供另一服务。</p><p><strong>易错点：</strong>一台设备可能有多个IP；不同IP可以使用相同端口号。端口号并不在全球唯一。</p></div></details><div class="quiz-rating"></div></article>
  <article class="question" data-quiz="d1-q2"><h3>2 / 把问题放回对应的层。</h3><p>A. 请求中怎样表达“我要首页”？<br>B. IP包怎样跨网络转发？<br>C. 如何用无线电信号承载比特？<br>D. 数据应交给哪个端口的通信端点？</p><div class="quiz-input"></div><details><summary>查看参考答案</summary><div class="answer"><p>A：应用层，组织有意义的消息。B：网络层，处理IP寻址与转发。C：物理层，承载信号。D：传输层，端口属于TCP/UDP等传输协议。</p><p><strong>易错点：</strong>“都和发送数据有关”不代表都属于同一层。判断时先问“具体在解决什么问题”。</p></div></details><div class="quiz-rating"></div></article>
  <article class="question" data-quiz="d1-q3"><h3>3 / 分层的价值，能用换Wi-Fi的例子解释吗？</h3><p>一台电脑从Wi-Fi接入换成网线接入。网站是否必须因此把HTTP规则重新设计一次？说明理由。</p><div class="quiz-input"></div><details><summary>查看参考答案</summary><div class="answer"><p>通常不需要。接入方式改变主要影响更底层的能力；应用层仍可按HTTP规则组织请求。分层让上层使用下层提供的服务，减少彼此对具体实现的依赖。</p><p>这不表示换网络永远不会产生连接中断或地址变化；题目只是在问应用通信规则是否必须跟着重写。</p></div></details><div class="quiz-rating"></div></article>
  <article class="question" data-quiz="d1-q4"><h3>4 / 封装只是在反复复制同一段内容吗？</h3><p>在本课的TCP示例中，应用已经形成请求数据。为什么还要加入TCP与IP等层的信息？请分别举出一种用途。</p><div class="quiz-input"></div><details><summary>查看参考答案</summary><div class="answer"><p>不是单纯重复。不同层加入不同职责需要的信息。例如TCP首部中有端口信息；IP首部中有源、目标IP地址信息。下层处理自己的控制信息，并承载上层数据。</p><p>应用的一条请求不一定对应一个TCP段；TCP可能将应用数据分段传输。</p></div></details><div class="quiz-rating"></div></article>
  <article class="question" data-quiz="d1-q5"><h3>5 / 七层、五层、四层，谁才是真的？</h3><p>朋友说：“我看到一本书写七层，这个课件写五层，所以一定有一个错了。”你会怎样回应？</p><div class="quiz-input"></div><details><summary>查看参考答案</summary><div class="answer"><p>要先看模型口径。OSI是七层参考模型；Internet体系结构常用四层描述；五层是常见教学划分。它们对职责的组合方式不同，不能只凭层数判断正误。</p><p>例如，OSI的应用、表示和会话三层，在五层教学对照中常归入应用层。</p></div></details><div class="quiz-rating"></div></article>
  <p id="quiz-summary" class="notice" hidden></p>
</section>

<details class="source-map lesson-sources"><summary>原题与参考资料</summary><div id="day-source-map" class="source-items"></div><div id="day-references"></div></details>
</template>
  <script>(() => {
  'use strict';
  const course = JSON.parse(document.getElementById('course-data').textContent);
  const lessonHTML = document.getElementById('lesson-01').innerHTML;

  const KEY = 'network-foundations-12:learner:v1';
  const phases = { recall: '回忆', main: '主线', quiz: '自测', close: '收尾' };
  const fresh = () => ({ schema: 1, courseId: course.id, fields: {}, ratings: {}, completed: [], timing: { recall: 0, main: 0, quiz: 0, close: 0 } });
  const allowedFields = new Set([...document.getElementById('lesson-01').content.querySelectorAll('[data-save]')].map(el => el.dataset.save));
  for (let i = 1; i <= 5; i++) allowedFields.add(`d1-q${i}-answer`);
  allowedFields.add('feedback-draft');
  const allowedRatings = new Set(['d1-client-server', 'd1-layers', 'd1-addresses', ...Array.from({ length: 5 }, (_, i) => `d1-q${i + 1}`)]);
  function cleanState(raw) {
    if (!raw || raw.schema !== 1 || raw.courseId !== course.id) throw Error('这不是本课程的学习记录。');
    const next = fresh();
    for (const [k, v] of Object.entries(raw.fields || {})) if (allowedFields.has(k) && (typeof v === 'boolean' || typeof v === 'string' && v.length <= 20000)) next.fields[k] = v;
    for (const [k, v] of Object.entries(raw.ratings || {})) if (allowedRatings.has(k) && ['understood', 'partial', 'review'].includes(v)) next.ratings[k] = v;
    if (Array.isArray(raw.completed)) next.completed = [...new Set(raw.completed.filter(x => Number.isInteger(x) && x >= 1 && x <= 12))];
    for (const k of Object.keys(phases)) if (Number.isFinite(raw.timing?.[k]) && raw.timing[k] >= 0 && raw.timing[k] < 31536000000) next.timing[k] = raw.timing[k];
    return next;
  }
  let state = fresh(), persistent = true;
  try { const raw = localStorage.getItem(KEY); if (raw) state = cleanState(JSON.parse(raw)); } catch { persistent = false; }

  const esc = value => String(value).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const formatTime = ms => { const seconds = Math.floor(ms / 1000); return `${String(Math.floor(seconds / 60)).padStart(2, '0')}:${String(seconds % 60).padStart(2, '0')}`; };
  const totalTime = () => Object.values(state.timing).reduce((a, b) => a + b, 0);
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); persistent = true; } catch { persistent = false; }
    $('storage-warning').hidden = persistent;
  }
  function toast(message) { $('toast').textContent = message; $('toast').classList.add('show'); clearTimeout(toastTimeout); toastTimeout = setTimeout(() => $('toast').classList.remove('show'), 4200); }
  function renderNav() {
    $('day-nav').innerHTML = course.days.map(day => `${day.day === 1 || day.day === 7 ? `<div class="week-label">第${day.week}周</div>` : ''}<button class="day-button ${currentDay === day.day && currentView === 'lesson' ? 'active' : ''} ${state.completed.includes(day.day) ? 'done' : ''}" data-day="${day.day}" ${currentDay === day.day && currentView === 'lesson' ? 'aria-current="page"' : ''}><span class="day-number">${state.completed.includes(day.day) ? '✓' : String(day.day).padStart(2, '0')}</span><span class="day-copy">${esc(day.title)}</span></button>${day.day === 6 || day.day === 12 ? '<div class="rest-label">休息日</div>' : ''}`).join('');

    document.querySelector('.study-tools').hidden = view !== 'lesson';
    renderNav();
  }
  function openDay(number, scroll = true) {
    pauseTimer(); currentDay = number;
    const day = course.days.find(x => x.day === number);
    showView('lesson');
    $('day-label').textContent = `第${number}天`;
    $('lesson-title').textContent = day.title;
    $('lesson-meta').hidden = number === 1;
    $('lesson-meta').innerHTML = number === 1 ? '' : '<span class="chip">未开放</span>';
    if (number === 1) { $('day-content').innerHTML = lessonHTML; hydrateLesson(); }
    else $('day-content').innerHTML = `${planCard(day, false)}<button data-day="1">返回第1天</button>`;
    $('timer-toggle').disabled = number !== 1;
    $('phase-select').disabled = number !== 1;
    $('section-nav').hidden = number !== 1;
    renderTimer();
    if (scroll) { window.scrollTo(0, 0); $('workspace').focus({ preventScroll: true }); }
  }
  function updateQuizSummary() {
    const el = $('quiz-summary'); if (!el) return;
    const scores = Array.from({ length: 5 }, (_, i) => state.ratings[`d1-q${i + 1}`]);
    el.hidden = !scores.some(Boolean);
    el.textContent = `自评：${scores.filter(x => x === 'understood').length}题能独立解释，${scores.filter(x => x === 'partial').length}题部分理解，${scores.filter(x => x === 'review').length}题需重学。`;
  }
  function updateCompletion() {
    const done = state.completed.includes(1);
    if ($('mark-complete')) $('mark-complete').textContent = done ? '撤销本日完成标记' : '标记本日完成';
    if ($('completion-note')) $('completion-note').textContent = done ? '本日已完成' : '';
  }
  function tick() {
    if (running) {
      const now = Date.now();
      state.timing[phase] += Math.max(0, now - startedAt);
      startedAt = now;
    }
  }
  function pauseTimer() { tick(); running = false; save(); renderTimer(); }
  function renderTimer() {
    if (!$('timer-display')) return;
    $('timer-display').textContent = currentDay === 1 ? formatTime(totalTime()) : '—';
    $('timer-toggle').textContent = running ? '暂停计时' : totalTime() > 0 ? '继续计时' : '开始计时';
    $('timer-hint').textContent = currentDay !== 1 ? '正文尚未制作，暂不计时' : totalTime() >= 5400000 ? '已用时90分钟' : '本日用时 / 90分钟';
    $('phase-times').innerHTML = currentDay === 1 ? Object.entries(phases).map(([k, v]) => `<span>${v} ${formatTime(state.timing[k])}</span>`).join('') : '';
  }
  const layerInfo = {
    application: ['应用层：先约定“说的是什么”。', '浏览器表达“我要这份资源”，服务器表达“这是结果”。它们需要能理解彼此的消息，而不是只收到一串没有含义的比特。'],
    transport: ['传输层：为应用端点提供运输服务。', '不同运输规则提供不同能力。TCP面向可靠、有序的字节流；UDP提供数据报传输，本身不保证可靠到达。端口属于传输层。'],
    network: ['网络层：跨网络寻找并转发到目标。', '数据可能经过多个网络。IP地址参与寻址，路由器根据转发信息决定下一步交到哪里。此处还不负责理解“我要首页”这句话。'],
    link: ['链路层：处理当前这段链路上的交付。', '例如电脑与接入设备之间的以太网或Wi-Fi链路。先把它和“跨多个网络到达最终目标”区分；实际路径可包含多段不同链路。'],
    physical: ['物理层：让比特有信号载体。', '数据最终要用实际信号传输，例如网线中的电信号、光纤中的光信号或无线电信号。不是一张抽象网页直接在空气里飞。']
  };
  function changeLayer(key) {
    const info = layerInfo[key];
    document.querySelectorAll('[data-layer]').forEach(el => el.setAttribute('aria-pressed', String(el.dataset.layer === key)));
    document.querySelectorAll('[data-stack]').forEach(el => el.classList.toggle('active', el.dataset.stack === key));
    $('layer-explanation').innerHTML = `<strong>${info[0]}</strong><p>${info[1]}</p>`;
  }
  function renderEnvelope() {
    const labels = ['应用请求数据', 'TCP首部 · 端口等信息', 'IP首部 · 源与目标地址', '链路控制信息 · 当前链路'];
    let html = `<div class="packet" data-level="0">${labels[0]}</div>`;
    for (let i = 1; i <= encap; i++) html = `<div class="packet"><span class="packet-label">${labels[i]}</span>${html}</div>`;
    $('encap-visual').innerHTML = html;
    $('encap-visual').setAttribute('aria-label', ['只有应用数据', 'TCP控制信息包住应用数据', 'IP控制信息包住TCP段', '链路控制信息承载IP数据报，内部有TCP信息和应用数据'][encap]);
    $('encap-step').textContent = `${encap} / 3`;
    $('encap-description').textContent = [
      '起点：应用已经组织好要交流的内容。',
      '传输层：TCP加入端口等控制信息。在这个简化示例里，形成承载应用数据的TCP段。',
      '网络层：IP加入源与目标地址等信息，承载上层的TCP段。IP负责自己的寻址与转发问题。',
      '链路层：形成适合当前链路传送的帧。接下来用物理信号承载比特；接收时再逐层处理。'
    ][encap];
    $('encap-next').disabled = encap === 3;
  }
  function openFeedback(topic) {
    tick();
    feedbackTopic = topic || '本日整体';
    const element = $(topic);
    feedbackTopicLabel = element?.dataset.topic || (topic === 'd1-close' ? '收尾与整体反馈' : '本日整体');
    $('feedback-context').textContent = `自动附上位置：第${currentDay}天 · ${feedbackTopicLabel} · v${course.version}`;
    const examples = {
      'd1-client-server': '例如：同一台计算机可以同时是客户端和服务器吗？',
      'd1-layers': '例如：我知道分层是分工，但还不明白封装具体加了什么。',
      'd1-addresses': '例如：IP已经找到服务器了，为什么还需要端口？'
    };
    $('feedback-note').placeholder = examples[topic] || '例如：我理解的是……，但不明白为什么……';
    $('feedback-note').value = state.fields['feedback-draft'] || '';
    $('feedback-note').removeAttribute('aria-invalid');
    $('feedback-error').hidden = true;
    $('feedback-preview').open = false;
    $('feedback-status').textContent = '';
    makeFeedback();
    $('feedback-dialog').showModal();
    $('feedback-note').focus();
  }
  function makeFeedback() {
    const labels = { understood: '能独立解释', partial: '部分理解', review: '需要重学' };
    const ratings = Array.from({ length: 5 }, (_, i) => {
      const value = state.ratings[`d1-q${i + 1}`];
      return value ? `Q${i + 1}=${labels[value]}` : '';
    }).filter(Boolean);
    const lines = [
      `课程：${course.title}`,
      `位置：第${currentDay}天 · ${feedbackTopicLabel} · v${course.version}`,
      `我的问题：${$('feedback-note').value.trim() || '（在上方写下问题后，这里会自动更新）'}`
    ];
    if (currentDay === 1 && totalTime() >= 1000) lines.push(`主动学习计时：${formatTime(totalTime())}`);
    if (currentDay === 1 && ratings.length) lines.push(`已填写的自测自评：${ratings.join('，')}`);
    lines.push('请用适合初学者的解释、图解或例子讲清，再用一道小问题检查我的理解。如果适合补进课件，请提出具体修改建议并询问我是否更新。');
    $('feedback-output').value = lines.join('\n');
  }
  async function copyFeedback() {
    if (!$('feedback-note').value.trim()) {
      $('feedback-error').hidden = false;
      $('feedback-note').setAttribute('aria-invalid', 'true');
      $('feedback-note').focus();
      return;
    }
    tick(); makeFeedback();
    try {
      await navigator.clipboard.writeText($('feedback-output').value);
      $('feedback-status').textContent = '已复制。回到我们的聊天输入框，粘贴后发送即可。';
    } catch {
      $('feedback-preview').open = true;
      $('feedback-output').focus(); $('feedback-output').select();
      $('feedback-status').textContent = '浏览器未允许自动复制。已选中整理好的文字，请手动复制，再粘贴到聊天输入框。';
    }
  }
  function exportData() {
    tick(); save();
    const data = { ...state, exportedAt: new Date().toISOString(), courseVersion: course.version };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob), link = document.createElement('a');
    link.href = url; link.download = 'network-learning-record.json'; link.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast('已导出当前记录。导入可恢复；如需我查看，请在会话中提供记录。');
  }
  document.addEventListener('click', event => {
    const target = event.target.closest('button, a[data-view]'); if (!target) return;
    if (target.dataset.view) { event.preventDefault(); showView(target.dataset.view); window.scrollTo(0, 0); }
    if (target.dataset.day) openDay(Number(target.dataset.day));
    if (target.dataset.layer) changeLayer(target.dataset.layer);
    if (target.dataset.port) {
      const port = target.dataset.port;
      document.querySelectorAll('[data-service]').forEach(el => el.classList.toggle('active', el.dataset.service === port));
      document.querySelectorAll('[data-port]').forEach(el => el.setAttribute('aria-pressed', String(el.dataset.port === port)));
      $('port-explanation').textContent = `目标为TCP的 198.51.100.20:${port}。${port === '443' ? '现在选择课程首页。' : '现在选择另一项服务。'}IP没变，目标端口变了。`;
    }
    if (target.dataset.feedback) openFeedback(target.dataset.feedback);
    if (target.dataset.rate) {
      state.ratings[target.dataset.rate] = target.dataset.value;
      document.querySelectorAll('[data-rate]').forEach(el => { if (el.dataset.rate === target.dataset.rate) el.setAttribute('aria-pressed', String(el.dataset.value === target.dataset.value)); });
      save(); updateQuizSummary();
    }
    if (target.id === 'encap-next') { encap = Math.min(3, encap + 1); renderEnvelope(); }
    if (target.id === 'encap-reset') { encap = 0; renderEnvelope(); }
    if (target.id === 'feedback-open') openFeedback('本日整体');
    if (target.id === 'copy-feedback') copyFeedback();
    if (target.id === 'timer-toggle') {
      if (running) pauseTimer();
      else { running = true; startedAt = Date.now(); renderTimer(); }
    }
    if (target.id === 'mark-complete') {
      if (state.completed.includes(1)) state.completed = state.completed.filter(x => x !== 1);
      else {
        const rated = Array.from({ length: 5 }, (_, i) => state.ratings[`d1-q${i + 1}`]).filter(Boolean).length;
        if (rated < 5) { toast('请先完成5题自评，或把未完成处标为“需要重学”。'); return; }
        state.completed.push(1); pauseTimer();
      }
      save(); renderNav(); updateCompletion();
    }
    if (target.id === 'export-data') exportData();
    if (target.id === 'print-page') window.print();
  });
  function saveField(event) {
    const el = event.target;
    if (!el.dataset.save) return;
    state.fields[el.dataset.save] = el.type === 'checkbox' ? el.checked : el.value;
    save();
  }
  document.addEventListener('input', saveField);
  document.addEventListener('change', saveField);
  $('phase-select').addEventListener('change', event => { tick(); phase = event.target.value; save(); renderTimer(); });
  $('feedback-note').addEventListener('input', () => {
    state.fields['feedback-draft'] = $('feedback-note').value;
    $('feedback-error').hidden = true;
    $('feedback-note').removeAttribute('aria-invalid');
    $('feedback-status').textContent = '';
    save(); makeFeedback();
  });
  $('import-data').addEventListener('change', async event => {
    const file = event.target.files[0]; if (!file) return;
    try {
      if (file.size > 1000000) throw Error('记录文件过大，请选择本课件导出的JSON。');
      const imported = cleanState(JSON.parse(await file.text()));
      if (!window.confirm('导入将替换当前浏览器的本课程记录。建议先导出备份。继续吗？')) return;
      pauseTimer(); state = imported; save(); openDay(currentDay, false); toast('学习记录已恢复。计时保持暂停。');
    } catch (error) { toast(`未导入：${error.message}`); }
    finally { event.target.value = ''; }
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden && running) pauseTimer(); });
  window.addEventListener('pagehide', pauseTimer);
  let ticks = 0;
  setInterval(() => { if (running) { tick(); renderTimer(); if (++ticks % 10 === 0) save(); } }, 1000);
  $('version').textContent = course.version;
  $('storage-warning').hidden = persistent;
  renderRoadmap(); renderGuide(); openDay(1, false);
})();
</script>
</body>
</html>
